name: Alliance Weekly Recap

on:
  schedule:
    - cron: "0 20 * * TUE"   # Tuesday 20:00 UTC
  workflow_dispatch: {}

jobs:
  build-recap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -V
          python -m pip install --upgrade pip
          pip install requests reportlab
          python -c "import sys,requests,reportlab; print('[DEBUG] deps ok:', requests.__version__)"

      - name: Debug league id
        env:
          SLEEPER_LEAGUE_ID: ${{ secrets.SLEEPER_LEAGUE_ID }}
        run: |
          echo "SLEEPER_LEAGUE_ID='${SLEEPER_LEAGUE_ID}'"
          if [ -z "${SLEEPER_LEAGUE_ID}" ]; then
            echo "Warning: SLEEPER_LEAGUE_ID is empty; script will use default."
          fi

      - name: Generate Alliance recap PDF
        env:
          SLEEPER_LEAGUE_ID: ${{ secrets.SLEEPER_LEAGUE_ID }}
        run: |
          set -x
          python alliance_recap.py
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alliance-Weekly-Recap
          path: "*.pdf"
          if-no-files-found: warn   # don't fail the job; see logs instead
